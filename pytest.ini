[pytest]
pythonpath = .
testpaths = tests
base_url = https://portalstg.optimalmd.com
addopts =
    -v
    -s
    --headed
    --slowmo 300
    --browser chromium
    -rA
    --screenshot only-on-failure
    --output test-results
markers =
    smoke: quick checks of critical paths
    e2e: full new-member journey (register, email, login, activate, add a dependent, dependent login)
